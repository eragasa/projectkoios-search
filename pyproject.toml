[project]
name = "projectkoios-search"
version = "0.0.0"
description = "full-text and semantic search infrastructure"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = [
    "projectkoios==0.0.0",
    "projectkoios-ingestion==0.0.0",
    "projectkoios-references==0.0.0",
    "pymongo>=4.10,<4.11",
]

[tool.uv.sources]
projectkoios-ingestion = { git = "https://github.com/eragasa/projectkoios-ingestion.git", rev = "b146d684f07513f5a726457e7dd082e73edb50e0" }
projectkoios-references = { git = "https://github.com/eragasa/projectkoios-references.git", rev = "d9f80ce4e540e8692835487b7a76d936fe906acc" }

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[project.optional-dependencies]
dev = [
    "mongomock>=4.3,<5",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = [
    "src/python",
    "../projectkoios/src/python",
    "../projectkoios-ingestion/src/python",
    "../projectkoios-references/src/python",
]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["latex2mathml", "latex2mathml.*", "mongomock", "pymupdf"]
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
